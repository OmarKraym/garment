    <script>
      "use strict";
      const CONFIG = {
        url: "https://vtbenbngmpwzcqmixtzb.supabase.co",
        key: "sb_publishable_Zx1GaORI0HFLO-LlIEQEOg_gcF7O4dQ",
      };
      const ST = {
        supervisor: "المشرف",
        cutter: "القصاص",
        tailor: "الخياط",
        finish1: "تشطيب 1",
        press: "المكوجي",
        finish2: "تشطيب 2",
        warehouse: "المخزن",
        dashboard: "المراجعة",
        settings: "الإعدادات",
      };
      const STATUS = {
        planned: "مخططة",
        cutting: "في القص",
        in_progress: "قيد الإنتاج",
        closed: "مكتملة",
      };
      const TYPES = {
        forward: "إرسال",
        return: "إرجاع",
        rework: "إعادة خياطة",
        confirm: "استلام",
        cut_adjust: "تعديل قص",
      };

        cutter: "#3c6953",
        pending: "#aa7c17",
        tailor: "#df8539",
        finish1: "#659d89",
        press: "#517a90",
        finish2: "#8e7c9e",
        warehouse: "#1f7a4d",

        cutter: "tailor",

        finish1: "press",
        press: "finish2",

      const backward = {
        tailor: "cutter",
        finish1: "tailor",
        press: "finish1",
        finish2: "press",
      };
      const esc = (x) =>
        String(x ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const id = () => crypto.randomUUID();
      const $ = (s) => document.querySelector(s);
      const dialog = $("#dialog");
      let S = null,
        busy = false,
        tab = "pending",
        refreshing = null,
        installEvent = null;
      let selectedColors = ["أبيض", "كحلي"],
        selectedSizes = ["S", "M", "L", "XL"];
      const Store = {
        load() {
          try {
            return JSON.parse(localStorage.getItem("wip.preferences") || "{}");
          } catch {
            return {};
          }
        },
        save(v) {
          localStorage.setItem("wip.preferences", JSON.stringify(v));
        },
        session(v) {
          if (arguments.length) {
            v
              ? localStorage.setItem("wip.session", JSON.stringify(v))
              : localStorage.removeItem("wip.session");
          }
          try {
            return JSON.parse(localStorage.getItem("wip.session") || "null");
          } catch {
            return null;
          }
        },
        exportJSON() {
          const { me, ...data } = S;
          return JSON.stringify(data, null, 2);
        },
        async importJSON(file) {
          if (file.size > 8e6) throw Error("الملف أكبر من 8 ميجابايت");
          const data = JSON.parse(await file.text());
          if (
            data.version !== 1 ||
            !Array.isArray(data.orders) ||
            !Array.isArray(data.moves) ||
            !Array.isArray(data.lots)
          )
            throw Error("نسخة غير صالحة");
          return data;
        },
      };
      let pref = Store.load();
      function preference(k, v) {
        pref[k] = v;
        Store.save(pref);
      }
      const canAdmin = () => S?.me.roles.includes("ADMIN");
      const canAudit = () =>
        S?.me.roles.some((x) =>
          ["ADMIN", "SUPERVISOR", "REVIEWER"].includes(x),
        );
      const Rules = {
        balance(station, holder, order, color, size, state) {
          return (S?.lots || [])
            .filter(
              (l) =>
                (!station || l.station === station) &&
                (holder === undefined || l.holderId === holder) &&
                (!order || l.orderId === order) &&
                (!color || l.color === color) &&
                (!size || l.size === size) &&
                (!state || l.state === state),
            )
            .reduce((a, l) => a + l.qty, 0);
        },
        can(s, h) {
          if (canAdmin()) return true;
          if (s === "supervisor") return S.me.roles.includes("SUPERVISOR");
          const stages = {
            cutter: "CUTTING",
            tailor: "SEWING",
            finish1: "FINISHING_1",
            press: "IRONING",
            finish2: "FINISHING_2",
            warehouse: "WAREHOUSE",
          };
          return (
            S.me.stages.includes(stages[s]) &&
            (s !== "tailor" ||
              S.tailors.some(
                (t) =>
                  t.id === h && t.employeeId === S.me.employee_id && t.active,
              ))
          );
        },
      };
      function allowed() {
        return Object.keys(ST).filter((s) =>
          s === "settings"
            ? canAdmin()
            : s === "dashboard"
              ? canAudit()
              : s === "tailor"
                ? canAdmin() || S.me.stages.includes("SEWING")
                : Rules.can(s),
        );
      }
      function order(oid) {
        return S.orders.find((o) => o.id === oid);
      }
      function tailor(h) {
        return S.tailors.find((t) => t.id === h)?.name || "خياط";
      }
      function toast(msg, error = false) {
        const el = $("#toast");
        el.textContent = msg;
        el.className = "toast" + (error ? " error" : "");
        el.hidden = false;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (el.hidden = true), 5500);
        if (!error) {
          navigator.vibrate?.(40);
          try {
            const C = window.AudioContext || window.webkitAudioContext;
            const ctx = new C(),
              osc = ctx.createOscillator(),
              gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 660;
            gain.gain.value = 0.025;
            osc.start();
            osc.stop(ctx.currentTime + 0.09);
            osc.onended = () => ctx.close();
          } catch {}
        }
      }
      async function session() {
        let s = Store.session();
        if (!s) throw Error("سجل الدخول أولاً");
        if (s.expires_at * 1000 < Date.now() + 60000) {
          if (!refreshing)
            refreshing = (async () => {
              const r = await fetch(
                CONFIG.url + "/auth/v1/token?grant_type=refresh_token",
                {
                  method: "POST",
                  headers: {
                    apikey: CONFIG.key,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ refresh_token: s.refresh_token }),
                },
              );
              if (!r.ok) {
                Store.session(null);
                throw Error("انتهت الجلسة. سجل الدخول من جديد");
              }
              s = await r.json();
              s.expires_at = Math.floor(Date.now() / 1000) + s.expires_in;
              Store.session(s);
              return s;
            })().finally(() => (refreshing = null));
          return refreshing;
        }
        return s;
      }
      async function rpc(name, args = {}) {
        if (!navigator.onLine)
          throw Error("لا يوجد اتصال. العمليات متاحة بعد عودة الإنترنت");
        const s = await session();
        const r = await fetch(CONFIG.url + "/rest/v1/rpc/" + name, {
          method: "POST",
          headers: {
            apikey: CONFIG.key,
            Authorization: "Bearer " + s.access_token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(args),
        });
        const data = await r.json();
        if (!r.ok) throw Error(data.message || "تعذر تنفيذ العملية");
        return data;
      }
      async function load() {
        S = await rpc("wip_snapshot");
        if (
          !pref.lastTailorId ||
          !S.tailors.some((t) => t.id === pref.lastTailorId && t.active)
        )
          preference(
            "lastTailorId",
            S.tailors.find((t) => t.employeeId === S.me.employee_id)?.id ||
              S.tailors.find((t) => t.active)?.id,
          );
        if (!allowed().includes(pref.lastStation))
          preference("lastStation", allowed()[0] || "dashboard");
      }
      async function dispatch(action, key) {
        await rpc("wip_dispatch", { p: action, k: key || id() });
        await load();
      }
      async function transfer(p, key) {
        await dispatch({ action: "transfer", ...p }, key);
      }
      const UI = {
        render() {
          if (!S) return login();
          let page = pref.lastStation;
          const nav = allowed();
          $("#app").innerHTML =
            `<header class="top"><div class="brand">عهدة <small>من أول قطعة… إلى آخر استلام</small></div><div class="row">${installEvent ? '<button class="install" data-act="install">تثبيت</button>' : ""}<span class="status">${navigator.onLine ? "متصل بالمصنع" : "غير متصل"}</span><button data-act="logout" aria-label="تسجيل الخروج">خروج</button></div></header><main class="wrap">${!navigator.onLine ? '<div class="notice">أنت غير متصل. الأرقام المعروضة آخر نسخة محملة؛ لا يمكن تسجيل عمليات الآن.</div>' : ""}<div class="eyebrow">مصنع الملابس / ${esc(S.me.display_name)}</div>${page === "supervisor" ? screens.supervisor() : page === "dashboard" ? Dashboard.render() : page === "settings" ? screens.settings() : screens.station(page)}</main><nav class="nav" aria-label="التنقل">${nav
              .slice(0, 4)
              .map(
                (s, i) =>
                  `<button data-nav="${s}" class="${page === s ? "on" : ""}" ${page === s ? 'aria-current="page"' : ""}><span class="ico">${["▦", "◈", "▤", "◎"][i]}</span>${ST[s]}</button>`,
              )
              .join(
                "",
              )}${nav.length > 4 ? `<button data-act="more" class="${nav.slice(4).includes(page) ? "on" : ""}"><span class="ico">•••</span>المزيد</button>` : ""}</nav>`;
        },
        modal(title, body) {
          dialog.innerHTML = `<div class="dialog-head"><h2>${title}</h2><button class="close" data-act="close" aria-label="إغلاق">×</button></div>${body}`;
          if (!dialog.open) dialog.showModal();
        },
        empty(title, text) {
          return `<div class="empty"><span style="font-size:36px">◇</span><b>${title}</b><p>${text}</p></div>`;
        },
      };
      function login() {

            if (
              !raw ||
              JSON.parse(raw).prevHash !== prev ||
              m.prevHash !== prev

      }
      function moveModal(l, ret) {
        const dest = (ret ? backward : forward)[l.station];
        const tailors = S.tailors.filter((t) => t.active);
        UI.modal(
          ret ? "إرجاع قطع" : "إرسال إلى " + ST[dest],
          `<form data-form="transfer" data-lot="${l.id}" data-dest="${dest}" data-type="${ret ? (dest === "tailor" ? "rework" : "return") : "forward"}"><p>${esc(order(l.orderId)?.orderNo)} · ${esc(l.color)} / ${esc(l.size)}</p>${
            dest === "tailor"
              ? `<label>الخياط المستلم</label>${picker(
                  "toHolder",
                  tailors.map((t) => [t.id, t.name]),
                  tailors[0]?.id || "",
                )}`
              : ""
          }${qty(l.qty, l.qty)}${
            ret
              ? `<label>سبب الإرجاع</label>${picker(
                  "reason",
                  (l.station === "tailor"
                    ? ["عيب قص", "عيب قماش"]
                    : l.station === "finish1"
                      ? ["عيب خياطة"]
                      : ["مراجعة الجودة", "إعادة معالجة"]
                  ).map((x) => [x, x]),
                  l.station === "tailor"
                    ? "عيب قص"
                    : l.station === "finish1"
                      ? "عيب خياطة"
                      : "مراجعة الجودة",
                )}`
              : ""
          }<p class="footnote">${dest === "cutter" ? "تعود مباشرة لعهدة القص." : "ستصل معلّقة حتى يؤكد الطرف الآخر الاستلام."}</p><button class="${ret ? "danger" : "primary"} full">${ret ? "تأكيد الإرجاع" : "تأكيد الإرسال"}</button></form>`,
        );
      }
      async function run(fn) {
        if (busy) return;

          if (!b.disabled) {
            b.dataset.busy = "1";
            b.disabled = true;
          }
        });
        try {
          await fn();

          toast(
            /fetch|network|Failed/i.test(e.message)
              ? "تعذر الاتصال. أعد المحاولة بنفس الزر لتجنب تكرار العملية."
              : e.message,
            true,
          );

          document.querySelectorAll("[data-busy]").forEach((b) => {
            b.disabled = false;
            delete b.dataset.busy;
          });
        }

      let pendingKeys = new Map();
